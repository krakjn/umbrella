name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: krakjn/bump@v8

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      
      - name: delta-bump
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          # github.base_ref is empty on push; use pull_request.base.ref on PRs only.
          bump patch --if-changed-from "$BASE" api/bump.toml
          bump patch --if-changed-from "$BASE" cli/bump.toml
          bump patch --if-changed-from "$BASE" lib/bump.toml
          bump patch --if-changed-from "$BASE" net/bump.toml
          bump calendar
          git add -u
          git config user.name "umbrella-ci"
          git config user.email "umbrella-ci@umbrella.corp"
          git commit -m "chore: bump to $(bump print)"
          bump tag
          git -P tag -l
          git -P log --oneline --decorate -n 20

      - name: pack
        run: ./pkg/create.sh

      - uses: actions/upload-artifact@v7
        with:
          name: debs
          path: dist/*.deb
