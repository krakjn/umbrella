name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: krakjn/bump@v8

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      
      - name: delta-bump
        # if: github.event_name == 'pull_request' && github.base_ref == github.default_branch
        run: |
          # PR checkout is detached; fetch-depth: 0 has origin/main, not local main.
          BASE=origin/${{ github.base_ref }}
          bump patch --if-changed-from "$BASE" api/bump.toml
          bump patch --if-changed-from "$BASE" cli/bump.toml
          bump patch --if-changed-from "$BASE" lib/bump.toml
          bump patch --if-changed-from "$BASE" net/bump.toml
          bump calendar
          git add -u
          git commit -m "chore: bump to $(bump print)"
          bump tag
          git -P tag -l
          git -P log --oneline --decorate -n 20

      - name: pack
        run: ./pkg/create.sh

      - uses: actions/upload-artifact@v7
        with:
          name: debs
          path: dist/*.deb
