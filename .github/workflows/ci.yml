name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: krakjn/bump@v8

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: pack
        run: ./pkg/create.sh

      - uses: actions/upload-artifact@v7
        with:
          name: debs
          path: dist/*.deb

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: debs
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          title: Release umbrella-${{ github.ref_name }}
          generate-release-notes: true
          files: |
            dist/*.deb
