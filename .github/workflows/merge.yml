name: Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  bump:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN is not enough to trigger a tag pipeline on ci.yml
          token: ${{ secrets.UMBRELLA_TOKEN }}

      - uses: krakjn/bump@v8

      - name: bump and tag
        env:
          # main tip before merge; diff to HEAD is what the PR landed
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bump patch --if-changed-from "$BASE" api/bump.toml
          bump patch --if-changed-from "$BASE" cli/bump.toml
          bump patch --if-changed-from "$BASE" lib/bump.toml
          bump patch --if-changed-from "$BASE" net/bump.toml
          bump calendar
          git add -u
          git config user.name "umbrella-ci"
          git config user.email "umbrella-ci@umbrella.corp"
          git commit -m "chore: bump to $(bump print)"
          bump tag
          git push origin main --follow-tags
